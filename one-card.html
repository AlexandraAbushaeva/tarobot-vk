
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Карта Дня</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js"></script>

    <style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #1a1a1a url('bg.jpg') no-repeat center center fixed;
        background-size: cover;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    h3 {
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 2px 2px 4px black;
        margin-bottom: 25px;
        letter-spacing: 2px;
        text-align: center;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 90px);
        gap: 20px 15px;
        justify-content: center;
    }

    .card-container {
        width: 90px;
        height: 150px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.2), 0 4px 10px rgba(0,0,0,0.5);
        border-radius: 10px;
    }

    .card-container:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    .card-container.flipped {
        transform: rotateY(180deg);
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
    }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
    }

    .card-front {
        background: url('back.jpg') no-repeat center center;
        background-size: cover;
        border: 1px solid rgba(255, 215, 0, 0.3);
    }

    .card-back {
        transform: rotateY(180deg);
        background-color: #000;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        border: 2px solid gold;
        display: flex;
        align-items: flex-end;
    }

    .card-name-tag {
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        font-size: 10px;
        width: 100%;
        text-align: center;
        padding: 5px 0;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        font-weight: bold;
    }

    #confirm-btn {
        display: none;
        margin-top: 35px;
        padding: 15px 50px;
        background: linear-gradient(135deg, #6e45e2 0%, #a485ff 100%);
        border: none;
        color: white;
        border-radius: 30px;
        font-weight: bold;
        text-transform: uppercase;
        box-shadow: 0 0 20px rgba(110, 69, 226, 0.5);
        cursor: pointer;
    }

    .locked {
        opacity: 0.4;
        filter: grayscale(0.8);
        pointer-events: none;
    }
    </style>
</head>

<body>

    <h3 id="header">Выберите карту</h3>
    <div class="grid" id="grid"></div>
    <button id="confirm-btn">УЗНАТЬ РЕЗУЛЬТАТ</button>

    <script>
        vkBridge.send('VKWebAppInit')
            .catch(console.error);

        const scriptURL = "https://script.google.com/macros/s/AKfycbyD0tPoh7h1YNWAiASIyux-FiQKGO6aZidwS7ltlk991ve1_NGJpoPF46IuUp6maDbJ/exec";

        const imgBase = "https://raw.githubusercontent.com/LindseyB/tarot-api/master/public/cards/";

        const deck = [];

        const majors = [
            {n:"Шут", f:"TheFool"},
            {n:"Маг", f:"TheMagician"},
            {n:"Жрица", f:"TheHighPriestess"},
            {n:"Императрица", f:"TheEmpress"},
            {n:"Император", f:"TheEmperor"},
            {n:"Иерофант", f:"TheHierophant"},
            {n:"Влюбленные", f:"TheLovers"},
            {n:"Колесница", f:"TheChariot"},
            {n:"Сила", f:"Strength"},
            {n:"Отшельник", f:"TheHermit"},
            {n:"Колесо Фортуны", f:"WheelOfFortune"},
            {n:"Справедливость", f:"Justice"},
            {n:"Повешенный", f:"TheHangedMan"},
            {n:"Смерть", f:"Death"},
            {n:"Умеренность", f:"Temperance"},
            {n:"Дьявол", f:"TheDevil"},
            {n:"Башня", f:"TheTower"},
            {n:"Звезда", f:"TheStar"},
            {n:"Луна", f:"TheMoon"},
            {n:"Солнце", f:"TheSun"},
            {n:"Суд", f:"Judgement"},
            {n:"Мир", f:"TheWorld"}
        ];

        majors.forEach(m => {
            deck.push({
                name: m.n,
                img: m.f + ".png"
            });
        });

        const suits = [
            {id:"Wands", ru:"Жезлов"},
            {id:"Cups", ru:"Кубков"},
            {id:"Swords", ru:"Мечей"},
            {id:"Pentacles", ru:"Пентаклей"}
        ];

        const rankFiles = [
            "01","02","03","04","05","06","07",
            "08","09","10","11","12","13","14"
        ];

        const rankNames = [
            "Туз","2","3","4","5","6","7",
            "8","9","10","Паж","Рыцарь","Королева","Король"
        ];

        suits.forEach(suit => {
            rankFiles.forEach((f, i) => {
                deck.push({
                    name: rankNames[i] + " " + suit.ru,
                    img: suit.id + f + ".png"
                });
            });
        });

        const grid = document.getElementById('grid');
        const btn = document.getElementById('confirm-btn');
        const header = document.getElementById('header');

        let selected = [];
        let isSending = false;
        let completed = false;
        let wasHidden = false;

        function shuffleDeck() {
            const cards = [...deck];

            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }

            return cards.slice(0, 3);
        }

        function resetCards() {
            selected = [];
            isSending = false;
            completed = false;
            wasHidden = false;

            grid.innerHTML = "";
            grid.style.display = "grid";

            header.innerText = "Выберите карту";

            btn.style.display = "none";
            btn.disabled = false;
            btn.innerText = "УЗНАТЬ РЕЗУЛЬТАТ";

            const shuffled = shuffleDeck();

            shuffled.forEach(card => {
                const container = document.createElement('div');
                container.className = 'card-container';

                const finalImgUrl = imgBase + card.img + "?v=1";

                container.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back" style="background-image: url('${finalImgUrl}')">
                        <div class="card-name-tag">${card.name}</div>
                    </div>
                `;

                container.onclick = () => {
                    if (isSending || completed) return;

                    if (
                        selected.length < 1 &&
                        !container.classList.contains('flipped')
                    ) {
                        container.classList.add('flipped');
                        selected.push(card.name);

                        btn.style.display = 'block';
                        header.innerText = "Ваша карта выбрана";

                        document.querySelectorAll(
                            '.card-container:not(.flipped)'
                        ).forEach(c => {
                            c.classList.add('locked');
                        });
                    }
                };

                grid.appendChild(container);
            });
        }

        // Экран после подтверждения выбора
        function showSuccess() {
            completed = true;

            grid.style.display = "none";
            btn.style.display = "none";

            header.innerText = "Ваш выбор зафиксирован! ✨";

            const message = document.createElement("div");
            message.id = "success-message";

            message.style.textAlign = "center";
            message.style.maxWidth = "300px";
            message.style.padding = "20px";
            message.style.lineHeight = "1.7";
            message.style.color = "#ffffff";
            message.style.fontSize = "16px";
            message.style.textShadow = "1px 2px 5px black";

            message.innerHTML = `
                <p>🔮 Карта выбрана!</p>
                <p>
                    Закройте приложение и вернитесь
                    в чат с ботом, чтобы получить
                    свой расклад.
                </p>
            `;

            document.body.appendChild(message);
        }

        // Подготовка нового расклада
        function startNewReading() {
            const message = document.getElementById(
                "success-message"
            );

            if (message) {
                message.remove();
            }

            resetCards();
        }

        // Отправка выбранной карты
        btn.onclick = async () => {
            if (
                selected.length !== 1 ||
                isSending ||
                completed
            ) return;

            isSending = true;

            btn.disabled = true;
            btn.innerText = "ОТПРАВКА...";

            try {
                const user = await vkBridge.send(
                    "VKWebAppGetUserInfo"
                );

                const userId = user.id;

                if (!userId) {
                    throw new Error("Не получен VK ID");
                }

                const url = new URL(scriptURL);

                url.searchParams.set(
                    "user_id", String(userId)
                );
                url.searchParams.set(
                    "cards", selected[0]
                );
                url.searchParams.set(
                    "_t", String(Date.now())
                );

                await fetch(url.toString(), {
                    method: "GET",
                    mode: "no-cors",
                    cache: "no-store"
                });

                showSuccess();

            } catch (error) {
                console.error(
                    "Не удалось отправить карту:",
                    error
                );

                isSending = false;
                btn.disabled = false;
                btn.innerText = "УЗНАТЬ РЕЗУЛЬТАТ";

                alert(
                    "Не удалось отправить карту. Попробуйте снова."
                );
            }
        };

        // Когда пользователь уходит из приложения
        document.addEventListener(
            "visibilitychange",
            () => {
                if (document.hidden) {
                    wasHidden = true;
                } else if (wasHidden && completed) {
                    startNewReading();
                }
            }
        );

        // Восстановление страницы из кэша браузера
        window.addEventListener("pageshow", (event) => {
            if (event.persisted && completed) {
                startNewReading();
            }
        });

        // Восстановление VK Mini App
        vkBridge.subscribe((event) => {
            if (
                event.detail.type === "VKWebAppViewRestore" &&
                completed &&
                wasHidden
            ) {
                startNewReading();
            }
        });

        // Первый запуск
        resetCards();

    </script>
</body>
</html>
