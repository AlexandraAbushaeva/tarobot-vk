
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Таро Расклад</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge@2.15.0/dist/browser.min.js"></script>

    <style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #1a1a1a url('bg.jpg') no-repeat center center fixed;
        background-size: cover;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    h3 {
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 2px 2px 4px black;
        margin-bottom: 25px;
        letter-spacing: 2px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(6, 45px);
        gap: 20px 12px;
        justify-content: center;
    }

    .card-container {
        width: 90px;
        height: 150px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        cursor: pointer;
        grid-column: span 2;
        /* Мягкое базовое свечение, чтобы карта не сливалась с фоном */
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.2), 0 4px 10px rgba(0,0,0,0.5);
        border-radius: 10px;
    }

    /* Эффект при наведении — карта «оживает» */
    .card-container:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    .card-container:nth-child(4) { grid-column: 2 / 4; }
    .card-container:nth-child(5) { grid-column: 4 / 6; }

    .card-container.flipped {
        transform: rotateY(180deg);
        /* Особое свечение для открытой карты */
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
    }

    .card-front {
        background: url('back.jpg') no-repeat center center;
        background-size: cover;
        border: 1px solid rgba(255, 215, 0, 0.3);
    }

    .card-back {
        transform: rotateY(180deg);
        background-color: #000;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        border: 2px solid gold;
        display: flex;
        align-items: flex-end;
    }

    .card-name-tag {
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        font-size: 10px;
        width: 100%;
        text-align: center;
        padding: 5px 0;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        font-weight: bold;
    }

    #confirm-btn {
        display: none;
        margin-top: 35px;
        padding: 15px 50px;
        background: linear-gradient(135deg, #6e45e2 0%, #a485ff 100%);
        border: none;
        color: white;
        border-radius: 30px;
        font-weight: bold;
        text-transform: uppercase;
        box-shadow: 0 0 20px rgba(110, 69, 226, 0.5);
        cursor: pointer;
    }

    .locked {
        opacity: 0.4;
        filter: grayscale(0.8);
        pointer-events: none;
    }
    </style>
</head>

<body>

    <h3 style="text-transform: uppercase; text-shadow: 2px 2px 4px black;">Выберите 3 карты</h3>

    <div class="grid" id="grid"></div>

    <button id="confirm-btn">ПОДТВЕРДИТЬ ВЫБОР</button>

    <script>

    // Один VK Mini App — два режима, без переходов на другую страницу.
    // Приоритет: новый маршрут от VK, затем hash, затем параметры запуска.
    let bridgeRoute = null;

    function normalizeMode(value) {
        if (!value) return null;
        let candidate = String(value).replace(/^#/, "").toLowerCase();
        try { candidate = decodeURIComponent(candidate); } catch (_) {}
        return candidate === "one" || candidate === "three" ? candidate : null;
    }

    function getLaunchMode() {
        const params = new URLSearchParams(window.location.search);
        return normalizeMode(bridgeRoute) ||
            normalizeMode(window.location.hash) ||
            normalizeMode(params.get("vk_app_start_param")) ||
            normalizeMode(params.get("vk_start_param")) ||
            normalizeMode(params.get("mode")) ||
            "three";
    }

    let isOneCard = getLaunchMode() === "one";
    let cardsToSelect = isOneCard ? 1 : 3;
    let cardsToShow = isOneCard ? 3 : 5;

    function updateMode(forceReset = false) {
        const newIsOneCard = getLaunchMode() === "one";
        const changed = newIsOneCard !== isOneCard;
        if (!changed && !forceReset) return;

        isOneCard = newIsOneCard;
        cardsToSelect = isOneCard ? 1 : 3;
        cardsToShow = isOneCard ? 3 : 5;
        document.querySelector("h3").innerText =
            isOneCard ? "Выберите карту" : "Выберите 3 карты";
        resetCards();
    }

    const header = document.querySelector("h3");
    header.innerText = isOneCard ? "Выберите карту" : "Выберите 3 карты";

    // Инициализация VK Mini App
    vkBridge.send('VKWebAppInit')
        .catch(console.error);

    // Google Apps Script
    const scriptURL = "https://script.google.com/macros/s/AKfycbyD0tPoh7h1YNWAiASIyux-FiQKGO6aZidwS7ltlk991ve1_NGJpoPF46IuUp6maDbJ/exec";

    // Изображения карт
    const imgBase = "https://raw.githubusercontent.com/LindseyB/tarot-api/master/public/cards/";

    const deck = [];

    const majors = [
        {n:"Шут", f:"TheFool"},
        {n:"Маг", f:"TheMagician"},
        {n:"Жрица", f:"TheHighPriestess"},
        {n:"Императрица", f:"TheEmpress"},
        {n:"Император", f:"TheEmperor"},
        {n:"Иерофант", f:"TheHierophant"},
        {n:"Влюбленные", f:"TheLovers"},
        {n:"Колесница", f:"TheChariot"},
        {n:"Сила", f:"Strength"},
        {n:"Отшельник", f:"TheHermit"},
        {n:"Колесо Фортуны", f:"WheelOfFortune"},
        {n:"Справедливость", f:"Justice"},
        {n:"Повешенный", f:"TheHangedMan"},
        {n:"Смерть", f:"Death"},
        {n:"Умеренность", f:"Temperance"},
        {n:"Дьявол", f:"TheDevil"},
        {n:"Башня", f:"TheTower"},
        {n:"Звезда", f:"TheStar"},
        {n:"Луна", f:"TheMoon"},
        {n:"Солнце", f:"TheSun"},
        {n:"Суд", f:"Judgement"},
        {n:"Мир", f:"TheWorld"}
    ];

    majors.forEach(m => {
        deck.push({
            name: m.n,
            img: m.f + ".png"
        });
    });

    const suits = [
        {id:"Wands", ru:"Жезлов"},
        {id:"Cups", ru:"Кубков"},
        {id:"Swords", ru:"Мечей"},
        {id:"Pentacles", ru:"Пентаклей"}
    ];

    const rankFiles = [
        "01","02","03","04","05","06","07",
        "08","09","10","11","12","13","14"
    ];

    const rankNames = [
        "Туз","2","3","4","5","6","7",
        "8","9","10","Паж","Рыцарь","Королева","Король"
    ];

    suits.forEach(suit => {
        rankFiles.forEach((f, i) => {
            deck.push({
                name: rankNames[i] + " " + suit.ru,
                img: suit.id + f + ".png"
            });
        });
    });

    const grid = document.getElementById('grid');
    const btn = document.getElementById('confirm-btn');

    let selected = [];
    let isSending = false;

    // Перемешивание полной колоды
    function shuffleDeck() {
        const cards = [...deck];

        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));

            [cards[i], cards[j]] = [cards[j], cards[i]];
        }

        return cards.slice(0, cardsToShow);
    }

    // Создание нового расклада
    function resetCards() {

        selected = [];
        isSending = false;

        grid.innerHTML = "";

        btn.style.display = "none";
        btn.disabled = false;
        btn.innerText = isOneCard ? "УЗНАТЬ РЕЗУЛЬТАТ" : "ПОДТВЕРДИТЬ ВЫБОР";

        const shuffled = shuffleDeck();

        shuffled.forEach(card => {

            const container = document.createElement('div');

            container.className = 'card-container';

            const finalImgUrl = imgBase + card.img + "?v=1";

            container.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-face card-back" style="background-image: url('${finalImgUrl}')">
                    <div class="card-name-tag">${card.name}</div>
                </div>
            `;

            container.onclick = () => {

                if (isSending) return;

                if (
                    selected.length < cardsToSelect &&
                    !container.classList.contains('flipped')
                ) {

                    container.classList.add('flipped');

                    selected.push(card.name);

                    if (selected.length === cardsToSelect) {

                        btn.style.display = 'block';

                        document.querySelectorAll(
                            '.card-container:not(.flipped)'
                        ).forEach(c => {
                            c.classList.add('locked');
                        });
                    }
                }
            };

            grid.appendChild(container);
        });
    }

    // Отправка выбора в Google Apps Script
    btn.onclick = async () => {

        if (selected.length !== cardsToSelect || isSending) return;

        isSending = true;

        btn.disabled = true;
        btn.innerText = "ОТПРАВКА...";

        try {

            const user = await vkBridge.send(
                "VKWebAppGetUserInfo"
            );

            const userId = user.id;

            if (!userId) {
                throw new Error("Не получен VK ID");
            }

            const url = new URL(scriptURL);

            url.searchParams.set("user_id", String(userId));
            url.searchParams.set("cards", selected.join(", "));
            url.searchParams.set("_t", String(Date.now()));

            await fetch(url.toString(), {
                method: "GET",
                mode: "no-cors",
                cache: "no-store"
            });

            btn.innerText = "КАРТЫ ОТПРАВЛЕНЫ ✓";

            // Подготавливаем новый выбор на случай повторного открытия.
            resetCards();
            
            // Пробуем закрыть VK Mini App
            try {
                await vkBridge.send("VKWebAppClose", {
                    status: "success"
                });
            } catch (error) {
                console.warn("VK не разрешил закрыть приложение:", error);
            }

        } catch (error) {

            console.error("Ошибка отправки карт:", error);

            isSending = false;

            btn.disabled = false;
            btn.innerText = isOneCard ? "УЗНАТЬ РЕЗУЛЬТАТ" : "ПОДТВЕРДИТЬ ВЫБОР";

            alert("Не удалось отправить карты. Попробуй снова.");
        }
    };

    // Первый запуск: создаём новый набор карт
    resetCards();

    // Смена маршрута внутри текущего WebView.
    window.addEventListener("hashchange", () => {
        bridgeRoute = null;
        updateMode();
    });

    // Восстановление Mini App после сворачивания и изменение адреса VK.
    vkBridge.subscribe((event) => {
        const type = event?.detail?.type;
        if (type === "VKWebAppLocationChanged") {
            const location = event?.detail?.data?.location;
            const incoming = normalizeMode(location);
            if (incoming) bridgeRoute = incoming;
            else bridgeRoute = null;
            updateMode(true);
        } else if (type === "VKWebAppViewRestore") {
            updateMode(true);
        }
    });

    window.addEventListener("pageshow", (event) => {
        if (event.persisted) updateMode(true);
    });

    </script>
</body>
</html>
